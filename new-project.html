<body class="text-2xl md:text-[100%] bg-sky-900">
    <header class="flex lg:justify-evenly justify-between px-3 h-[] bg-blue-950 text-gray-500 text-[140%]">
        <img src="./images/hamburger.png" id="hum" alt="hamburger menu" class="lg:w-0 w-auto h-[2em] my-auto">
        <a href="#" class="my-auto lg:w-[15%] md:max-w-[50%] w-full p-0 ">
            <img src="./images/planit_ai_all_white.png" alt="">
        </a>
        <nav
            class="lg:flex lg:justify-between gap-5 my-auto p-2 absolute lg:static flex flex-col lg:flex-row lg:w-auto lg:bg-transparent rounded-xl mt-4 w-[93%] bg-sky-950 hidden">
            <button class="mx-auto pl-[80%] text-3xl font-black text-black lg:hidden" id="x">X</button>
            <a class="hover:text-gray-50 border border-gray-500 hover:border-amber-50 p-2 lg:mx-5 mx-[10%] text-center rounded-xl"
                href="./index.html">Dashboard</a>
            <a class="hover:text-gray-50 border border-gray-500 hover:border-amber-50 border-b-amber-400 hover:border-b-amber-400 p-2 lg:mx-5 mx-[10%] text-center rounded-xl"
                href="new-project.html">Nouveau projet</a>
        </nav>
        <div class="flex lg:justify-between lg:gap-5 flex-col lg:flex-row my-auto">
            <button
                class="hidden bg-sky-600 rounded-xl text-amber-300 hover:bg-sky-800 lg:hover:text-amber-300 px-3 text-[75%] sm:text-2xl lg:my-3 my-[2%] lg:w-[130%]">
                <a href="./new-project.html">+ Creat</a>
            </button>
            <button
                class="bg-sky-600 rounded-xl text-gray-50 hover:bg-sky-800 px-3 text-[75%] sm:text-2xl lg:my-3 my-[2%] lg:w-[130%]">
                Paramètres
            </button>
        </div>
    </header>
    <main class="h-[90vh] text-white flex">
        <form action="" id="newProject" class="bg-black w-[95%] m-auto p-2 rounded-2xl flex flex-wrap">
            <label class="w-[90%] " for="nom">Nom :</label>
            <input class="w-[90%] ml-6" type="text" id="nom" name="nom">
            <label class="w-[90%] " for="descr">Description :</label>
            <input class="w-[90%] ml-6" type="text" id="descr" name="descr">
            <label class="w-[90%] " for="brief">Brief Complet :</label>
            <textarea class="w-[90%] ml-6" name="brief" id="brief"></textarea>
            <label class="w-[90%] " for="duree">Durée :</label>
            <input class="w-[90%] ml-6" type="number" name="duree" id="duree">
            <label class="w-[90%] " for="nbrDev">Nombre de Développeurs :</label>
            <input class="w-[90%] ml-6" type="number" name="nbrDev" id="nbrDev">
            <label class="w-[90%] " for="techno">Technologies :</label>
            <input class="w-[90%] ml-6" type="text" name="techno" id="techno">
            <label class="w-[90%] " for="niv">Niveau de Difficulté </label>
            <select name="niv" id="niv" class="bg-sky-950 w-[90%] ml-6">
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate </option>
                <option value="advanced">Advanced</option>
            </select>
        </form>

    </main>
    <script>
        function cal(arr) {
            let som = 0;

            for (const n of arr) {
                som += n;
            }

            return Math.round((som / arr.length) * 100) / 100;
        }

        console.log(cal([1.999]))
    </script>
</body>

</html>
