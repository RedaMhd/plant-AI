<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Project</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="icon"
        href="https://imgs.search.brave.com/FtzJIkY_vsW0PHw6GDfOpHeXyKaTq0rnQTsFQq42R6Q/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9tZWRp/YS5pc3RvY2twaG90/by5jb20vaWQvMTUx/MDkxNzg4NC92ZWN0/b3IvY2FtZXJhLWlj/b24taXNvbGF0ZWQt/b24tdHJhbnNwYXJl/bnQtYmFja2dyb3Vu/ZC1lYXNpbHktZWRp/dGFibGUtbGluZS1h/cnQtc3ltYm9sLWZv/ci1kZXNpZ24uanBn/P3M9NjEyeDYxMiZ3/PTAmaz0yMCZjPU8z/Q2ttdVQzMmFWb1ZF/LVVKYjRFOGVKU05w/MGUtMlB3VjRtWTB6/VEpwZEk9">


</head>

<body class="text-2xl md:text-[100%] bg-sky-900">
    <header class="flex lg:justify-evenly justify-between px-3 h-[] bg-blue-950 text-gray-500 text-[150%]">
        <img src="./images/hamburger.png" id="hum" alt="hamburger menu" class="lg:w-0 w-auto h-[2em] my-auto">
        <a href="./index.html" class="my-auto lg:w-[15%] md:max-w-[50%] w-full p-0 ">
            <img src="./images/planit_ai_all_white.png" alt="">
        </a>
        <nav
            class="lg:flex lg:justify-between gap-5 my-auto p-2 absolute lg:static flex flex-col lg:flex-row lg:w-auto lg:bg-transparent rounded-xl mt-4 w-[93%] bg-sky-950 hidden">
            <button class="mx-auto pl-[80%] text-3xl font-black text-black lg:hidden" id="x">X</button>
            <a class="hover:text-gray-50 border border-gray-500 hover:border-amber-50 p-2 lg:mx-5 mx-[10%] text-center rounded-xl"
                href="./index.html">Dashboard</a>
            <a class="hover:text-gray-50 border border-gray-500 hover:border-amber-50 p-2 lg:mx-5 mx-[10%] text-center rounded-xl"
                href="new-project.html">Nouveau projet</a>
        </nav>
        <div class="flex lg:justify-between lg:gap-5 flex-col lg:flex-row my-auto">
            <button
                class="bg-sky-600 rounded-xl text-amber-300 hover:bg-sky-800 lg:hover:text-amber-300 px-3 text-[75%] sm:text-2xl lg:my-3 my-[2%] lg:w-[130%]">
                <a href="./new-project.html">+ Creat</a>
            </button>
            <button
                class="bg-sky-600 rounded-xl text-gray-50 hover:bg-sky-800 px-3 text-[75%] sm:text-2xl lg:my-3 my-[2%] lg:w-[130%]">
                Paramètres
            </button>
        </div>
    </header>

    <main class="min-h-[90vh] flex p-2">

        <form action="" class="bg-black rounded-2xl text-gray-300 w-[95%] mx-auto p-2 flex flex-wrap gap-1">
            <h2 class="mx-auto font-black text-amber-500">Créer un nouveau projet</h2> 

            <label class=" w-[90%] mt-4" for="nom">Nom du projet :</label>
            <input class=" w-[90%] bg-white text-blue-900 rounded-xl ml-[20%]" type="text" id="nom" name="nom" placeholder="Ex: Task Management App" required>
            <p class="onError-nom text-red-500 w-full border-t hidden"></p>

            <label class=" w-[90%] mt-4" for="desc">Description :</label>
            <textarea class=" w-[90%] bg-white text-blue-900 rounded-xl ml-[20%]" id="desc" name="desc" placeholder="Une description du projet..." required>
            </textarea>
            <p class="onError-desc text-red-500 w-full border-t hidden"></p>

            <label class=" w-[90%] mt-4" for="brief">Brief complet :</label>
            <textarea class=" w-[90%] bg-white text-blue-900 rounded-xl ml-[20%]" id="brief" name="brief" required>
            </textarea>
            <p class="onError-brief text-red-500 w-full border-t hidden"></p>

            <label class=" w-[90%] mt-4" for="duree">Durée :</label>
            <input class=" w-[90%] bg-white text-blue-900 rounded-xl ml-[20%]" type="number" id="duree" name="duree" min="1" placeholder="Ex: 30" required>
            <p class="onError-duree text-red-500 w-full border-t hidden"></p>

            <label class=" w-[90%] mt-4" for="nbrDev">Nombre de développeurs :</label>
            <input class=" w-[90%] bg-white text-blue-900 rounded-xl ml-[20%]" type="number" id="nbrDev" name="nbrDev" min="1" placeholder="Ex: 3" required>
            <p class="onError- text-red-500 w-full border-t hidden"></p>

            <label class=" w-[90%] mt-4" for="tech">Technologies :</label>
            <input class=" w-[90%] bg-white text-blue-900 rounded-xl ml-[20%]" type="text" id="tech" name="tech" required>
            <p class="onError-tech text-red-500 w-full border-t hidden"></p>

            <label class=" w-[90%] mt-4" for="diff">Niveau de difficulté :</label>
            <select class=" w-[90%] bg-blue-400 p-1 text-black ml-[20%] rounded-xl" id="diff" name="diff" required>
                <option value="">Choisir un niveau</option>
                <option value="beginner">Beginner</option>
                <option value="intermediate">Intermediate</option>
                <option value="advanced">Advanced</option>
            </select>
            <p class="onError-diff text-red-500 w-full border-t hidden"></p>

            <button type="submit" class="hover:text-amber-500 hover:border-amber-500 bg-blue-900 text-green-500 font-black p-2 m-auto mt-4 rounded-xl">Créer le projet</button>
        </form>

    </main>

    <script src="./js/main.js" type="module"></script>

</body>

</html>
