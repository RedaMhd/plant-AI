<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Project</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="icon"
        href="https://imgs.search.brave.com/FtzJIkY_vsW0PHw6GDfOpHeXyKaTq0rnQTsFQq42R6Q/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9tZWRp/YS5pc3RvY2twaG90/by5jb20vaWQvMTUx/MDkxNzg4NC92ZWN0/b3IvY2FtZXJhLWlj/b24taXNvbGF0ZWQt/b24tdHJhbnNwYXJl/bnQtYmFja2dyb3Vu/ZC1lYXNpbHktZWRp/dGFibGUtbGluZS1h/cnQtc3ltYm9sLWZv/ci1kZXNpZ24uanBn/P3M9NjEyeDYxMiZ3/PTAmaz0yMCZjPU8z/Q2ttdVQzMmFWb1ZF/LVVKYjRFOGVKU05w/MGUtMlB3VjRtWTB6/VEpwZEk9">

</head>

<body class="text-2xl md:text-[100%] bg-gray-400">

    <header class="flex lg:justify-evenly justify-between px-3 h-[] bg-blue-950 text-gray-500 text-[140%]">
        <img src="./images/hamburger.png" id="hum" alt="hamburger menu" class="lg:w-0 w-auto h-[2em] my-auto">
        <a href="./index.html" class="my-auto lg:w-[15%] md:max-w-[50%] w-full p-0 ">
            <img src="./images/planit_ai_all_white.png" alt="">
        </a>
        <nav
            class="lg:flex lg:justify-between gap-5 my-auto p-2 absolute lg:static flex flex-col lg:flex-row lg:w-auto lg:bg-transparent rounded-xl mt-4 w-[93%] bg-sky-950 hidden">
            <button class="mx-auto pl-[80%] text-3xl font-black text-black lg:hidden" id="x">X</button>
            <a class="hover:text-gray-50 border border-gray-500 hover:border-amber-50 p-2 lg:mx-5 mx-[10%] text-center rounded-xl"
                href="index.html">Dashboard</a>
            <a class="hover:text-gray-50 border border-gray-500 hover:border-amber-50 border-b-amber-400 hover:border-b-amber-400 p-2 lg:mx-5 mx-[10%] text-center rounded-xl"
                href="new-project.html">Nouveau projet</a>
        </nav>
        <div class="flex lg:justify-between lg:gap-5 flex-col lg:flex-row my-auto">
            <button
                class="bg-sky-600 rounded-xl text-amber-300 hover:bg-sky-800 lg:hover:text-amber-300 px-3 text-[75%] sm:text-2xl lg:my-3 my-[2%] lg:w-[130%]">
                <a href="./new-project.html">+ Creat</a>
            </button>
            <button id="btn-parametre"
                class="bg-sky-600 rounded-xl text-gray-50 hover:bg-sky-800 px-3 text-[75%] sm:text-2xl lg:my-3 my-[2%] lg:w-[130%]">
                Paramètres
            </button>
        </div>
    </header>
    <main class="min-h-[90vh] flex p-2">
        <div class="grid grid-rows-5  bg-sky-900 rounded-t-2xl p-2 m-auto md:min-w-[80%]">
            <div class="head row-span-1 md:mr-auto md:min-w-[50vh] md:flex text-center flex flex-col md:text-start md:p-6 gap-3 justify-center">
                <h1 class="title font-black">(projectName)</h1>
                <h2 class="time">(totalEstimatedHours)h</h2>
                <div class="bg-blue-950 w-[95%] mx-auto p-1 rounded-xl flex flex-wrap gap-2 text-gray-200">
                    <h2 class="w-full">total Tasks : 20</h2>
                    <div class="w-full flex justify-evenly">
                        <h3>done : 16</h3>
                        <h3>not yet : 4</h3>
                    </div>
                    <div class="bg-blue-50 w-[95%] mx-auto rounded-xl">
                        <div class="w-[70%] text-center bg-sky-500 rounded-xl">70%</div>
                    </div>
                </div>
            </div>
            <div class="body row-span-4 grid grid-rows-3 md:grid-cols-3 md:grid-rows-1 gap-2 bg-blue-900 rounded h-[140vh]">
                <div class="toDo row-span-1 md:col-span-1 border border-gray-200 rounded-2xl m-1 p-1" style="overflow-y: scroll;">
                    <h1 class="bg-gray-200 text-center rounded-2xl sticky top-0  ">To Do</h1>
                    <div class="taches p-2 h-[max-content] flex flex-col gap-2">

                    </div>
                </div>
                <div class="inProg row-span-1 md:col-span-1 border border-gray-200 rounded-2xl m-1 p-1" style="overflow-y: scroll;">
                    <h1 class="bg-gray-200 text-center rounded-2xl sticky top-0  ">In Progress</h1>
                    <div class="taches p-2 h-[max-content] flex flex-col gap-2">

                    </div>
                </div>
                <div class="done row-span-1 md:col-span-1 border border-gray-200 rounded-2xl m-1 p-1" style="overflow-y: scroll;">
                    <h1 class="bg-gray-200 text-center rounded-2xl sticky top-0  ">Done</h1>
                    <div class="taches p-2 h-[max-content] flex flex-col gap-2">

                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/parsleyjs@2.9.2/dist/parsley.min.js"></script>
    <script src="./js/main.js" type="module"></script>
</body>

</html>
